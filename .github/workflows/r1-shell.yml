name: Build Swells R1 shell

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/r1-shell/**"
      - "src/components/app/r1/**"
      - ".github/workflows/r1-shell.yml"
  push:
    branches:
      - master
    paths:
      - "apps/r1-shell/**"
      - "src/components/app/r1/**"
      - ".github/workflows/r1-shell.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require version bump for later native changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            exit 0
          fi

          changed="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" --             apps/r1-shell/app/src             apps/r1-shell/app/build.gradle.kts)"

          if [ -z "$changed" ]; then
            exit 0
          fi

          current_code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' apps/r1-shell/app/build.gradle.kts | head -1)"
          if ! git cat-file -e "$BASE_SHA:apps/r1-shell/app/build.gradle.kts" 2>/dev/null; then
            test -n "$current_code" && test "$current_code" -gt 0
            exit $?
          fi

          base_code="$(git show "$BASE_SHA:apps/r1-shell/app/build.gradle.kts" | sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' | head -1)"

          if [ -z "$base_code" ] || [ -z "$current_code" ] || [ "$current_code" -le "$base_code" ]; then
            echo "Native R1 changes require versionCode to increase (base=$base_code current=$current_code)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare stable debug signing key
        run: base64 --decode apps/r1-shell/debug-signing/swells-r1-debug.keystore.b64 > apps/r1-shell/debug-signing/swells-r1-debug.keystore

      - name: Build debug APK
        run: gradle -p apps/r1-shell :app:assembleDebug

      - name: Name APK
        run: cp apps/r1-shell/app/build/outputs/apk/debug/app-debug.apk swells-r1-shell-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: swells-r1-shell-debug
          path: swells-r1-shell-debug.apk
          if-no-files-found: error
