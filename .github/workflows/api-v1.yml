name: API v1 + MCP validation

on:
  push:
    branches:
      - feat/api-v1
      - master
    paths:
      - "src/app/api/v1/**"
      - "src/app/mcp/**"
      - "src/app/api/account/api-keys/**"
      - "src/app/**/account/api/**"
      - "src/lib/api-v1.ts"
      - "src/lib/db/api-schema.ts"
      - "src/lib/db/index.ts"
      - "src/components/app/app-shell.tsx"
      - "drizzle.config.ts"
      - ".github/workflows/api-v1.yml"
  pull_request:
    paths:
      - "src/app/api/v1/**"
      - "src/app/mcp/**"
      - "src/app/api/account/api-keys/**"
      - "src/app/**/account/api/**"
      - "src/lib/api-v1.ts"
      - "src/lib/db/api-schema.ts"
      - "src/lib/db/index.ts"
      - "src/components/app/app-shell.tsx"
      - "drizzle.config.ts"
      - ".github/workflows/api-v1.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
